# Device Configuration
# Configure your network devices for gNMI telemetry collection
#
# Each device entry should include:
#   - name: Unique identifier for the device
#   - type: Device type (ceos or sonic) - determines which paths to use
#   - host: IP address or hostname of the device
#   - port: gNMI port (default: 6030 for most devices)
#   - username: Authentication username
#   - password: Authentication password

devices:
  # Example cEOS device
  - name: ceos-spine1
    type: ceos
    host: 192.168.1.10
    port: 6030
    username: admin
    password: admin
  
  # Example cEOS device
  - name: ceos-leaf1
    type: ceos
    host: 192.168.1.20
    port: 6030
    username: admin
    password: admin
  
  # Example SONiC device
  - name: sonic-switch1
    type: sonic
    host: 192.168.1.30
    port: 8080
    username: admin
    password: YourPaSsWoRd
  
  # Example SONiC device
  - name: sonic-switch2
    type: sonic
    host: 192.168.1.31
    port: 8080
    username: admin
    password: YourPaSsWoRd
